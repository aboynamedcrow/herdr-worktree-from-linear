id = "tdi.worktree-from-linear"
name = "Worktree from Linear"
version = "0.6.0"
min_herdr_version = "0.9.0"
description = "Create a git worktree from a Linear issue and open it as a workspace"
platforms = ["linux", "macos"]

[[actions]]
id = "pick"
title = "Worktree from Linear issue"
contexts = ["workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HOME/dot/bin/agent-service-env\" run --inherit linear-ember,linear-hsys -- \"$@\"", "linear-route", "node", "bin/open.js"]

[[actions]]
id = "start"
title = "Start agent on Linear issue"
contexts = ["workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HOME/dot/bin/agent-service-env\" run --inherit linear-ember,linear-hsys -- \"$@\"", "linear-route", "node", "bin/open.js", "--start"]

[[actions]]
id = "show"
title = "Show Linear issue here"
contexts = ["workspace", "tab", "pane"]
command = ["sh", "-c", "exec \"$HOME/dot/bin/agent-service-env\" run --inherit linear-ember,linear-hsys -- \"$@\"", "linear-route", "node", "bin/open.js", "--show"]

[[panes]]
id = "picker"
title = "Pick a Linear issue"
placement = "overlay"
command = ["sh", "-c", "exec \"$HOME/dot/bin/agent-service-env\" run --inherit linear-ember,linear-hsys -- \"$@\"", "linear-route", "node", "bin/picker.js"]

[[panes]]
id = "issue"
title = "Linear issue"
placement = "split"
command = ["sh", "-c", "exec \"$HOME/dot/bin/agent-service-env\" run --inherit linear-ember,linear-hsys -- \"$@\"", "linear-route", "node", "bin/issue.js"]
